name: Keep Render Service Alive & Sync Pricelist

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CDPK System Planner Health Endpoint
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          TARGET="${RENDER_APP_URL:-https://cdpk-system-planner.onrender.com}"
          echo "Pinging $TARGET/health ..."
          curl -fsSL --max-time 20 "$TARGET/health" || true
